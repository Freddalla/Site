<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf7f5">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clínica">
<meta name="description" content="Gestão do consultório da Dra. Rebeca: atendimentos, retornos, despesas, receitas e lucro.">
<title>Clínica · Gestão</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="topo-nome">Clínica <em>Rebeca</em></span>
      <span class="topo-sub" id="topo-sub"></span>
    </div>
    <button class="icone-btn" id="btn-ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>

  <main id="tela" tabindex="-1"></main>

  <nav class="abas" aria-label="Seções">
    <a href="#inicio" data-aba="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span><b class="selo" id="selo-retornos" hidden></b></a>
    <a href="#pacientes" data-aba="pacientes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg><span>Pacientes</span></a>
    <button class="aba-mais" id="btn-lancar" aria-label="Lançar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#lancamentos" data-aba="lancamentos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Lançamentos</span></a>
    <a href="#resumo" data-aba="resumo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Resumo</span></a>
  </nav>

  <div class="fundo" id="fundo" hidden></div>
  <section class="folha" id="folha" role="dialog" aria-modal="true" hidden></section>
  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <div class="trava" id="trava" hidden>
    <div class="trava-caixa">
      <p class="trava-titulo">Clínica <em>Rebeca</em></p>
      <p class="trava-texto" id="trava-texto">Digite o PIN</p>
      <div class="trava-pontos" id="trava-pontos"><i></i><i></i><i></i><i></i></div>
      <div class="trava-teclado" id="trava-teclado"></div>
    </div>
  </div>

  <!-- O app mudou para um endereço só dele. Aqui só fica o caminho para levar os dados (backup) até lá. -->
  <script>window.CLINICA_NOVO_ENDERECO = 'https://gestao-clinica-rebeca.github.io/gestaoclinicarebeca/';</script>
  <script type="module" src="app.js"></script>
</body>
</html>
