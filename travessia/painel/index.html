<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diário de Bordo</title>
<meta name="description" content="Travessia · seu painel diário: uma pílula de sabedoria com protocolo, 5 minutos de meditação, 3 gratidões e a sua evolução.">
<meta name="theme-color" content="#0e1c20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Travessia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: uma coluna estreita, como a página de um caderno. Uma coisa por vez, muito respiro, navegação de 3 abas no rodapé. */
:root{
  --bg:#f1f2ee;        /* papel de névoa */
  --card:#fafaf7;
  --line:#d5dbd6;
  --fg:#10262a;        /* tinta de carta náutica */
  --muted:#5b6b68;
  --accent:#8a5f12;    /* farol, em tinta */
  --accent-soft:#efe5cf;
  --on-accent:#fbf6ea;
  --tide:#2f6d69;      /* maré */
  --tide-soft:#d9e8e5;
  --display:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1c20; --card:#14272a; --line:#24403f; --fg:#e8e3d6; --muted:#93a5a2;
    --accent:#d9b36a; --accent-soft:#2e3324; --on-accent:#1a1408; --tide:#6fa8a4; --tide-soft:#1b3536; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1c20; --card:#14272a; --line:#24403f; --fg:#e8e3d6; --muted:#93a5a2;
  --accent:#d9b36a; --accent-soft:#2e3324; --on-accent:#1a1408; --tide:#6fa8a4; --tide-soft:#1b3536; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:580px;margin-inline:auto;padding-inline:18px;padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance}
h1{font-size:2.4rem}
h2{font-size:1.9rem}
h3{font-size:1.45rem}
.mono{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.card > * + *{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:12px 20px;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--fg)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.05)}
.btn-small{padding:8px 14px;font-size:.84rem}
.btn-link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.field{display:grid;gap:6px;font-weight:600;font-size:.9rem}
label.field small{font-weight:400;color:var(--muted)}
input[type=text],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font-size:.88rem;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag{display:inline-block;font:500 .66rem var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.tide{background:var(--tide-soft);color:var(--tide)}

/* topo */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{display:flex;gap:8px;align-items:center;font:500 .74rem var(--mono);letter-spacing:.3em}
.brand svg{width:20px;height:20px}
.demo{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:20px;font-size:.88rem;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

/* hoje */
.greet{margin-bottom:22px}
.greet h1{margin-block:6px 6px}
.progress{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring text{font:600 13px var(--body);fill:var(--fg)}
.task-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.done-mark{font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tide)}
.quote{font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.3}
.ref{font-size:.82rem;color:var(--muted)}
.protocol{background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.protocol p{margin-top:4px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.check.done span{text-decoration:line-through;color:var(--muted)}
.personal{font-size:.9rem;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px}
.grat{display:grid;gap:10px}
.grat label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center}
.grat label b{font:500 .8rem var(--mono);color:var(--accent);text-align:center}
.grat .hint{grid-column:2;font-size:.76rem;color:var(--muted);margin-top:-6px}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 0;cursor:pointer;font-weight:600}
.scale button[aria-pressed="true"]{background:var(--tide);border-color:var(--tide);color:var(--bg)}
.complete{text-align:center;padding:36px 22px}
.complete svg{width:56px;height:56px;margin:0 auto 10px;color:var(--accent)}
.nudge{font-size:.9rem;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--muted)}

/* evolução */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1;font-weight:400;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--line);display:block;max-width:100%}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--line))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 60%,var(--line))}
.heat i[data-l="3"]{background:var(--accent)}
.heat i.today{outline:2px solid var(--fg);outline-offset:1px}
.heat-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
svg.chart{width:100%;height:auto;overflow:visible}
.chart text{font:500 10px var(--mono);fill:var(--muted)}
details.entry{border-top:1px solid var(--line);padding-block:12px}
details.entry summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
details.entry summary::-webkit-details-marker{display:none}
details.entry ul{margin:8px 0 0 18px;font-size:.92rem}
details.entry p{font-size:.92rem;margin-top:8px}
.slider{display:grid;grid-template-columns:96px 1fr 28px;gap:12px;align-items:center;font-size:.9rem}
.slider input{accent-color:var(--accent);width:100%}
.slider output{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

/* rumo */
.trail{display:grid;gap:2px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.trail div{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:9px 12px;font-size:.88rem;align-items:center}
.trail div.past{color:var(--muted)}
.trail div.now{background:var(--accent-soft);font-weight:600}
.action-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.med-plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.med-plan label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.danger{color:#b4472b}

/* onboarding */
.ob{min-height:80vh;display:flex;flex-direction:column;gap:22px;padding-top:12px}
.ob-bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.ob-bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.ob h1{font-size:2.6rem}
.ob p.lead{font-size:1.08rem;color:var(--muted)}
.ob-nav{display:flex;justify-content:space-between;gap:12px;margin-top:auto;padding-top:20px}
.phases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.phases div{border:1px solid var(--line);border-radius:12px;padding:12px}
.phases b{font-family:var(--display);font-size:1.3rem;font-weight:400;display:block}

/* nav inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs div{max-width:580px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{background:none;border:0;padding:14px 0 12px;cursor:pointer;display:grid;justify-items:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* meditação */
.med{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.med .orb-wrap{flex:1;display:grid;place-items:center;width:100%}
.orb{width:min(62vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 45%,transparent),color-mix(in srgb,var(--tide) 25%,transparent) 70%);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);transform:scale(.6);transition-property:transform;transition-timing-function:ease-in-out}
.med .phase{font:500 .8rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);min-height:1.2em;margin-top:18px}
.med .cue{font-family:var(--display);font-size:1.5rem;line-height:1.25;max-width:22ch;min-height:3.8em}
.med .time{font:500 1rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.orb{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden aria-label="Seções">
  <div>
    <button type="button" data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</button>
    <button type="button" data-tab="evolucao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/></svg>Evolução</button>
    <button type="button" data-tab="rumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M12 5l2 7-2 7-2-7z"/></svg>Rumo</button>
  </div>
</nav>
<div class="med" id="med" hidden role="dialog" aria-modal="true" aria-label="Meditação"></div>

<script src="conteudo.js"></script>
<script>
/* ======================================================================
   TRAVESSIA · Diário de Bordo
   Tudo fica salvo neste aparelho (localStorage). Exporte o backup no Rumo.
   ====================================================================== */
const KEY = 'travessia.painel.v1';
const PILAR_IDS = Object.keys(PILARES);
const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const app = document.getElementById('app'), tabsEl = document.getElementById('tabs'), medEl = document.getElementById('med');

let S = load();
let tab = 'hoje';
let ob = null;           // rascunho do onboarding
let ui = { revisao:false, rodaForm:false, confirmApagar:false, lerMais:false };

/* ---------------- utilidades ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dkey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((parseKey(dkey(b)) - parseKey(dkey(a))) / 864e5);
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pill = id => PILULAS.find(p => p.id === id);
const fmtDate = (d, opt) => d.toLocaleDateString('pt-BR', opt || { weekday:'long', day:'numeric', month:'long' });

function load(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; } }
let saveT; function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }, 150); }
function saveNow(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function faseDoDia(d){ return d <= 7 ? 'clareza' : d <= 14 ? 'corpo' : d <= 21 ? 'coragem' : 'direcao'; }
function diaTrilha(){ return diffDays(parseKey(S.perfil.inicio), new Date()) + 1; }

function gerarTrilha(trads, foco, seed, evitar = []){
  const r = rng(seed), pool = PILULAS.filter(p => trads.includes(p.trad));
  const used = new Set(evitar), out = [];
  for (let d = 1; d <= 30; d++){
    const fase = faseDoDia(d);
    let c = pool.filter(p => !used.has(p.id) && p.fase === fase);
    if (!c.length) c = pool.filter(p => !used.has(p.id));
    if (!c.length){ used.clear(); c = pool.slice(); }
    const score = p => (p.pilares.some(x => foco.includes(x)) ? 2 : 0) + r() + (d === 1 && p.id === 'mito-sisifo' ? 10 : 0);
    c.sort((a,b) => score(b) - score(a));
    used.add(c[0].id); out.push(c[0].id);
  }
  return out;
}

function dia(k = dkey()){
  if (!S.dias[k]) S.dias[k] = { feito:{}, grat:['','',''], resposta:'', energia:null, paz:null, medMin:0 };
  return S.dias[k];
}
function pilulaDe(k){
  const d = diffDays(parseKey(S.perfil.inicio), parseKey(k)) + 1;
  if (d >= 1 && d <= 30) return pill(S.perfil.trilha[d-1]);
  const pool = PILULAS.filter(p => S.perfil.tradicoes.includes(p.trad));
  return pool[hash(k) % pool.length];
}
function perguntaDe(k){
  const D = dia(k);
  if (D.pergunta) return D.pergunta;
  const n = diffDays(parseKey(S.perfil.inicio), parseKey(k)) + 1;
  if (n % 2 === 1) D.pergunta = pilulaDe(k).pergunta;
  else {
    const f = S.perfil.foco, arr = [...(PERGUNTAS[f[0]]||[]), ...(PERGUNTAS[f[1]]||[]), ...PERGUNTAS.geral];
    D.pergunta = arr[hash(k + 'q') % arr.length];
  }
  return D.pergunta;
}
function itensDoDia(k){
  const D = dia(k);
  const base = [['pilula', D.feito.pilula], ['med', D.feito.med], ['diario', D.feito.diario]];
  S.perfil.acoes.forEach(a => base.push(['a:' + a.id, !!D.feito['a:' + a.id]]));
  return base;
}
function diaCompleto(k){ const D = S.dias[k]; return !!(D && D.feito.pilula && D.feito.med && D.feito.diario); }
function nivel(k){
  const D = S.dias[k]; if (!D) return 0;
  const n = ['pilula','med','diario'].filter(x => D.feito[x]).length;
  return n;
}
/* Sequência com a regra "nunca falhe duas vezes": uma falha isolada não quebra. */
function sequencia(){
  let d = new Date(), n = 0, falhas = 0;
  if (!diaCompleto(dkey(d))) d = addDays(d, -1);
  const inicio = parseKey(S.perfil.inicioAbsoluto || S.perfil.inicio);
  while (d >= inicio){
    if (diaCompleto(dkey(d))){ n++; falhas = 0; }
    else { falhas++; if (falhas >= 2) break; }
    d = addDays(d, -1);
  }
  return n;
}

/* ---------------- som (sino) ---------------- */
let actx;
function sino(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [528, 792, 1056].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18 / (i+1), t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 4);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 4.1);
    });
  } catch(e){}
}

/* ======================================================================
   ONBOARDING · diagnóstico do momento
   ====================================================================== */
function iniciarOnboarding(){
  ob = { passo:0, nome:'', roda:Object.fromEntries(PILAR_IDS.map(p => [p, 5])), foco:[], sonho:'', infancia:'',
         woop:null, tradicoes:Object.keys(TRADICOES), acoes:[] };
}
const OB_TOTAL = 7;
function renderOnboarding(){
  tabsEl.hidden = true;
  const p = ob.passo;
  const bar = `<div class="ob-bar" aria-hidden="true"><i style="width:${p / OB_TOTAL * 100}%"></i></div>`;
  const nav = (proximo = 'Continuar', ok = true) => `<div class="ob-nav">${p > 0 ? '<button class="btn" data-act="ob-voltar">Voltar</button>' : '<span></span>'}<button class="btn btn-primary" data-act="ob-proximo" ${ok ? '' : 'disabled'}>${proximo}</button></div>`;
  let h = '';
  if (p === 0){
    h = `<div class="ob">
      ${marca()}
      <p class="mono">Travessia · diário de bordo</p>
      <h1>Menos tela.<br><em style="color:var(--accent)">Mais rumo.</em></h1>
      <p class="lead">Um painel para cinco minutos de manhã e cinco à noite. Todo dia: uma pílula de sabedoria (Buda, estoicos, Jesus, mitologia) com um protocolo prático, 5 minutos de meditação, 3 gratidões e uma pergunta. Você acompanha a própria evolução.</p>
      <p class="muted" style="font-size:.9rem">Antes, um diagnóstico de 4 minutos para montar a sua trilha de 30 dias. Seus dados ficam só neste aparelho.</p>
      <div class="ob-nav" style="flex-direction:column;align-items:stretch">
        <button class="btn btn-primary" data-act="ob-proximo">Fazer meu diagnóstico</button>
        <button class="btn" data-act="demo">Explorar com dados de exemplo</button>
        <button class="btn-link" data-act="importar-inicio" style="align-self:center;margin-top:6px">Tenho um backup</button>
      </div>
    </div>`;
  }
  if (p === 1){
    h = `<div class="ob">${bar}<p class="mono">1 de 6 · você</p><h1>Como você quer ser chamado?</h1>
      <label class="field">Nome<input type="text" id="ob-nome" data-ob="nome" value="${esc(ob.nome)}" autocomplete="given-name"></label>

  S = { versao:1, exemplo:true, perfil:{ nome:'Exemplo', inicio:dkey(inicio), inicioAbsoluto:dkey(inicio), foco, sonho:'Acordar perto do mar, viver do meu próprio projeto e ter tempo para treinar e para quem eu amo.', infancia:'Pulava da escada tentando voar.',
        woop:{ ...WOOP_SUGESTOES.proposito, desejo:WOOP_SUGESTOES.proposito.desejo, resultado:'Orgulho de ter começado.' }, tradicoes:trads,
        acoes:[{id:'e1',texto:'30 min no meu projeto'},{id:'e2',texto:'Primeira hora sem celular'}], plano:{...PLANO_MEDITACAO}, trilha:gerarTrilha(trads, foco, 42), trilhasConcluidas:0 },
        roda:[{ data:dkey(inicio), notas:{corpo:5,mente:4,proposito:3,relacoes:6,coragem:3,presenca:4} }, { data:dkey(addDays(hoje,-4)), notas:{corpo:6,mente:5,proposito:5,relacoes:6,coragem:5,presenca:5} }],
        dias:{}, avaliacoes:[{ data:dkey(addDays(hoje,-4)), nota:8, ajudou:'A pílula com protocolo. Saber o que fazer no dia.', faltou:'Um lembrete no celular.' }] };
  const grats = [['Café com minha mãe','Dormi bem','O sol no caminho'],['Um amigo me ligou','Treinei','Terminei uma tarefa chata'],['Risada no almoço','Caminhei sem fone','Uma ideia nova'],['Conversa honesta','Comida boa','Tempo livre à noite']];
  for (let i = 0; i < 11; i++){

function marca(){ return `<div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><path d="M12 3.5 14.4 12 12 20.5 9.6 12Z" fill="var(--accent)" stroke="none"/><path d="M12 3.5 14.4 12H9.6Z" fill="currentColor" stroke="none"/></svg>TRAVESSIA</div>`; }
function topo(){
  return `${S.exemplo ? `<div class="demo"><span>Você está vendo dados de exemplo.</span><button class="btn btn-small btn-primary" data-act="sair-exemplo">Começar o meu</button></div>` : ''}
    <div class="top">${marca()}<span class="mono">${fmtDate(new Date(), { day:'numeric', month:'short' })}</span></div>`;
}
function ring(done, total){
  const C = 2 * Math.PI * 22, off = C * (1 - (total ? done / total : 0));
  return `<svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="bg" cx="27" cy="27" r="22"/><circle class="fg" cx="27" cy="27" r="22" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 27 27)"/><text x="27" y="31" text-anchor="middle">${done}/${total}</text></svg>`;
}

function renderEvolucao(){
  const hoje = new Date(), inicioAbs = parseKey(S.perfil.inicioAbsoluto);
  const ks = Object.keys(S.dias);
  const completos = ks.filter(diaCompleto).length;
  const minutos = ks.reduce((a,k) => a + (S.dias[k].medMin || 0), 0);
  const grats = ks.reduce((a,k) => a + S.dias[k].grat.filter(g => g && g.trim()).length, 0);

  /* heatmap: 5 semanas terminando no sábado desta semana */
  const fim = addDays(hoje, 6 - hoje.getDay()), ini = addDays(fim, -34);
  let heat = '';
  for (let i = 0; i < 35; i++){
    const d = addDays(ini, i), k = dkey(d), fut = d > hoje;
    heat += `<i data-l="${fut ? 0 : nivel(k)}" class="${k === dkey() ? 'today' : ''}" title="${fmtDate(d, {day:'numeric',month:'short'})}: ${fut ? '' : nivel(k) + '/3'}" style="${fut ? 'opacity:.35' : ''}"></i>`;
  }

  /* energia e paz, últimos 30 dias */
  const W = 320, H = 120, pl = 18, pb = 18;
  const pts = (campo) => {
    const out = [];
    for (let i = 29; i >= 0; i--){ const k = dkey(addDays(hoje, -i)), D = S.dias[k]; if (D && D[campo]) out.push([pl + (29 - i) / 29 * (W - pl - 4), (H - pb) - (D[campo] - 1) / 4 * (H - pb - 8)]); }
    return out;
  };
  const line = (p, cor) => p.length ? `<polyline fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${p.map(x => x.join(',')).join(' ')}"/>${p.map(x => `<circle cx="${x[0]}" cy="${x[1]}" r="2.5" fill="${cor}"/>`).join('')}` : '';
  const pe = pts('energia'), pp = pts('paz');
  const grid = [1,3,5].map(v => { const y = (H - pb) - (v - 1) / 4 * (H - pb - 8); return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="0" y="${y + 3}">${v}</text>`; }).join('');
  const chart = (pe.length || pp.length) ? `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Energia e paz nos últimos 30 dias">${grid}<text x="${pl}" y="${H - 2}">30 dias atrás</text><text x="${W}" y="${H - 2}" text-anchor="end">hoje</text>${line(pe,'var(--tide)')}${line(pp,'var(--accent)')}</svg>` : `<p class="muted">Registre energia e paz no diário para ver a linha aparecer aqui.</p>`;

  /* radar da roda */
  const R = 92, cx = 130, cy = 120, ang = i => -Math.PI/2 + i * 2*Math.PI/6;
  const poly = notas => PILAR_IDS.map((id,i) => { const r = R * notas[id] / 10; return [cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))].map(n => n.toFixed(1)).join(','); }).join(' ');
  const primeira = S.roda[0], ultima = S.roda[S.roda.length-1];
  const radar = `<svg class="chart" viewBox="0 0 260 240" role="img" aria-label="Roda da vida">
    ${[.25,.5,.75,1].map(f => `<polygon points="${PILAR_IDS.map((_,i) => [cx + R*f*Math.cos(ang(i)), cy + R*f*Math.sin(ang(i))].join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('')}
    ${PILAR_IDS.map((id,i) => `<line x1="${cx}" y1="${cy}" x2="${cx + R*Math.cos(ang(i))}" y2="${cy + R*Math.sin(ang(i))}" stroke="var(--line)"/><text x="${cx + (R+16)*Math.cos(ang(i))}" y="${cy + (R+16)*Math.sin(ang(i)) + 3}" text-anchor="middle">${PILARES[id].nome.toUpperCase()}</text>`).join('')}
    ${S.roda.length > 1 ? `<polygon points="${poly(primeira.notas)}" fill="none" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5"/>` : ''}
    <polygon points="${poly(ultima.notas)}" fill="color-mix(in srgb, var(--accent) 22%, transparent)" stroke="var(--accent)" stroke-width="2"/>
  </svg>`;

  const ultimos = ks.filter(k => S.dias[k].grat.some(g => g && g.trim()) || S.dias[k].resposta).sort().reverse().slice(0, 14);

let medTimer = null, wake = null;
function abrirMeditacao(tipo){
  const M = MEDITACOES[tipo], TOTAL = 300;
  let t = 0, pausado = false, fasesIdx = -1, faseFim = 0;
  medEl.hidden = false; document.body.style.overflow = 'hidden';
  medEl.innerHTML = `<div><p class="mono">${esc(M.origem)}</p><h2 style="margin-top:6px">${esc(M.nome)}</h2></div>
    <div class="orb-wrap"><div><div class="orb" id="orb"></div><p class="phase" id="mphase"></p></div></div>
    <div class="stack" style="justify-items:center;width:100%"><p class="cue" id="mcue">${esc(M.cues[0][1])}</p><p class="time" id="mtime">5:00</p>
    <div class="row" style="justify-content:center"><button class="btn" id="mpause">Pausar</button><button class="btn" id="mstop">Encerrar</button></div></div>`;
  const orb = document.getElementById('orb'), ph = document.getElementById('mphase'), cue = document.getElementById('mcue'), tm = document.getElementById('mtime');
  sino();
  try { navigator.wakeLock?.request('screen').then(w => wake = w).catch(() => {}); } catch(e){}
  const ciclo = M.respiracao ? M.respiracao.reduce((a,f) => a + f[1], 0) : 0;
  const passo = () => {
    if (pausado) return;
    t += .25;
    if (M.respiracao){
      const pos = t % ciclo; let acc = 0, idx = 0;
      for (; idx < M.respiracao.length; idx++){ acc += M.respiracao[idx][1]; if (pos < acc) break; }
      if (idx !== fasesIdx){ fasesIdx = idx; const f = M.respiracao[idx]; orb.style.transitionDuration = f[1] + 's'; orb.style.transform = `scale(${f[2]})`; ph.textContent = f[0]; }
    } else {
      orb.style.transitionDuration = '6s'; orb.style.transform = `scale(${Math.floor(t / 6) % 2 ? .62 : .8})`;
    }
    const c = M.cues.filter(x => x[0] <= t).pop(); if (c && cue.textContent !== c[1]) cue.textContent = c[1];
    const rest = Math.max(0, TOTAL - Math.floor(t)); tm.textContent = Math.floor(rest/60) + ':' + pad(rest % 60);
    if (t >= TOTAL) fim(true);
  };
  const fim = (completo) => {
    clearInterval(medTimer); medTimer = null; try { wake?.release(); } catch(e){}
    const min = completo ? 5 : Math.floor(t / 60);
    const D = dia();
    if (completo || t >= 240){ D.feito.med = true; }
    D.medMin = (D.medMin || 0) + min; save();
    if (completo){ sino(); medEl.innerHTML = `<div></div><div class="stack" style="justify-items:center"><h2>Feito. 5 minutos.</h2><p class="muted">Repare como o corpo está agora.</p><button class="btn btn-primary" id="mclose">Voltar ao painel</button></div><div></div>`; document.getElementById('mclose').onclick = fechar; }
    else fechar();
  };
  const fechar = () => { medEl.hidden = true; medEl.innerHTML = ''; document.body.style.overflow = ''; render(); };
  document.getElementById('mpause').onclick = e => { pausado = !pausado; e.target.textContent = pausado ? 'Continuar' : 'Pausar'; };
  document.getElementById('mstop').onclick = () => fim(false);
  medTimer = setInterval(passo, 250); passo();
}

  if (a === 'sair-exemplo'){ try { localStorage.removeItem(KEY); } catch(e){} S = null; ob = null; render(); }

  /* hoje */
  if (a === 'ler-mais'){ ui.lerMais = true; render(); }

    D.feito.diario = true; saveNow(); render();

  if (a === 'nova-trilha'){

  }

    ui.rodaForm = false; saveNow(); render();

    ui.revisao = false; saveNow(); render();
  }

  /* rumo */
  const P = S && S.perfil;
  if (a === 'foco'){ const id = b.dataset.id; let f = P.foco.includes(id) ? P.foco.filter(x => x !== id) : [...P.foco, id].slice(-2); if (!f.length) return; P.foco = f; refazerFuturo(); saveNow(); render(); }
  if (a === 'trad'){ const id = b.dataset.id; let t = P.tradicoes.includes(id) ? P.tradicoes.filter(x => x !== id) : [...P.tradicoes, id]; if (!t.length) return; P.tradicoes = t; refazerFuturo(); saveNow(); render(); }
  if (a === 'rm-acao'){ P.acoes = P.acoes.filter(x => x.id !== b.dataset.id); saveNow(); render(); }
  if (a === 'add-acao' || a === 'add-sug'){
    const v = a === 'add-sug' ? b.dataset.txt : document.getElementById('nova-acao').value.trim();
    if (v && P.acoes.length < 3){ P.acoes.push({ id:'a' + Date.now().toString(36), texto:v }); saveNow(); render(); }
  }
  if (a === 'plano-padrao'){ P.plano = { ...PLANO_MEDITACAO }; saveNow(); render(); }
  if (a === 'exportar'){
    const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' }), url = URL.createObjectURL(blob);
    const l = document.createElement('a'); l.href = url; l.download = 'travessia-backup-' + dkey() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    msgDados('Se o download não começar, use "Copiar backup" e cole num bloco de notas.');
